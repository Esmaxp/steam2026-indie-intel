services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam}
      POSTGRES_DB: ${POSTGRES_DB:-steam2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steam} -d ${POSTGRES_DB:-steam2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Per-game community videos (lazy fetch) — empty = platform skipped.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      # Required for the channel-submission review endpoints.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/data/exports
      - ./logs:/data/logs
      - ./media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Phase 2 — run on demand:  docker compose run --rm discovery [--mode applist --limit 1000]
  discovery:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GAMALYTIC_API_KEY: ${GAMALYTIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy   # ensures migrations were applied
    volumes:
      - ./logs:/data/logs

  # Phase 3 — run on demand:  docker compose run --rm collector [--limit 500]
  collector:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GAMALYTIC_API_KEY: ${GAMALYTIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "scraper.collectors.run"]  # processes the whole queue

  # Phase 4 — run on demand:  docker compose run --rm market
  market:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GAMALYTIC_API_KEY: ${GAMALYTIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "scraper.collectors.run_market"]

  # Low-priority backfill — run occasionally:  docker compose run --rm websites [--limit 300]
  websites:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.backfill_websites"]

  # Channel discovery — run in batches:  docker compose run --rm scanner [--limit 200]
  scanner:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.scan_websites"]

  # Scheduled worker — run daily:  docker compose run --rm refresher
  refresher:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GAMALYTIC_API_KEY: ${GAMALYTIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.refresh_stats"]

  # Quick-start seed — real data in ~10 minutes on a fresh clone:
  #   docker compose run --rm seed
  # Discovers ~100 games from Steam Search (2 pages), then collects full
  # store data for the first 50. Safe to re-run; safe to interrupt.
  seed:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command:
      - sh
      - -c
      - |
        python -m scraper.discovery.run --mode search --max-pages 2 &&
        python -m scraper.collectors.run --limit 50

  # Warm the video cache for approved games:  docker compose run --rm video_prefetch [--limit 200]
  video_prefetch:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Worker containers don't read .env themselves — compose must inject these.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.prefetch_videos"]

  # Full pipeline:  docker compose run --rm pipeline
  # discovery → store data for ALL queued games → market data for ALL queued games
  pipeline:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GAMALYTIC_API_KEY: ${GAMALYTIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command:
      - sh
      - -c
      - |
        python -m scraper.discovery.run --mode search &&
        python -m scraper.collectors.run &&
        python -m scraper.collectors.run_market

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    environment:
      # Community Clips server-side keys (empty = platform gracefully skipped)
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_USER_LOGIN: ${TWITCH_USER_LOGIN:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
