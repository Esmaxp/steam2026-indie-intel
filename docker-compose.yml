services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam}
      POSTGRES_DB: ${POSTGRES_DB:-steam2026}
    ports:
      # host:container — the container side stays 5432 (namespaced, never clashes).
      - "${POSTGRES_PORT:-9432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steam} -d ${POSTGRES_DB:-steam2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Repo-root context: the API runs the collectors in-process for
      # admin-triggered sweeps, so it needs scraper/ and workers/.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Per-game community videos (lazy fetch) — empty = platform skipped.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # host:container — uvicorn listens on 8000 inside; 9100 is the host port.
      - "9100:8000"
    volumes:
      - ./exports:/data/exports
      - ./logs:/data/logs
      - ./media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Phase 2 — run on demand:  docker compose run --rm discovery
  # With flags, spell out the module (compose replaces `command:` with the args):
  #   docker compose run --rm discovery python -m scraper.discovery.run --mode applist --limit 1000
  discovery:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy   # ensures migrations were applied
    volumes:
      - ./logs:/data/logs

  # Phase 3 — run on demand:  docker compose run --rm collector
  #   with flags: docker compose run --rm collector python -m scraper.collectors.run --limit 500
  collector:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "scraper.collectors.run"]  # processes the whole queue

  # Phase 4 — run on demand:  docker compose run --rm market
  market:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "scraper.collectors.run_market"]

  # Unit tests — pure functions, no database, no network:
  #   docker compose run --rm tests
  #   docker compose run --rm tests python -m pytest tests/test_search_parse.py -v
  tests:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./tests:/srv/tests:ro
      - ./pytest.ini:/srv/pytest.ini:ro
    command: ["python", "-m", "pytest"]

  # Developer-disclosed wishlist counts from official Steam news:
  #   docker compose run --rm disclosures [--limit 500] [--write]
  # Writes CONFIRMED rows, so it defaults to a dry run: without --write it
  # only emits a CSV to ./logs for a human to review first.
  disclosures:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.harvest_disclosures"]

  # Community-hub follower counts — run daily in bounded batches:
  #   docker compose run --rm followers [--limit 500] [--dry-run]
  # Keyless first-party. A full 5.6k-game sweep is ~6h at 4s spacing, so
  # prefer several bounded runs over one long one.
  followers:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FOLLOWERS_MIN_INTERVAL: ${FOLLOWERS_MIN_INTERVAL:-4.0}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.refresh_followers"]

  # Valve Top-Wishlists ordinal sweep — run daily:
  #   docker compose run --rm rank_sweep [--dry-run]
  # First-party and unauthenticated: no API key of any kind. Records each
  # game's RANK, never a wishlist count — Valve publishes no counts.
  rank_sweep:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "scraper.collectors.run_rank_sweep"]

  # Low-priority backfill — run occasionally:  docker compose run --rm websites
  #   with flags: docker compose run --rm websites python -m workers.backfill_websites --limit 300
  websites:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.backfill_websites"]

  # Channel discovery — run in batches:  docker compose run --rm scanner
  #   with flags: docker compose run --rm scanner python -m workers.scan_websites --limit 200
  scanner:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.scan_websites"]

  # Free offline replay of the rule-based classifier over already-collected
  # games (dimension / camera / graphics style). Fills only, never overwrites.
  #   docker compose run --rm reclassify python -m workers.reclassify_classification --dry-run
  reclassify:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.reclassify_classification"]

  # Free offline similarity fallback for unresolved 2D/3D — no API key needed.
  # Measure first:
  #   docker compose run --rm dimension_local python -m workers.classify_dimension_local --dry-run
  dimension_local:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.classify_dimension_local"]

  # Opt-in, costs real API money. Flags need the full command form:
  #   docker compose run --rm dimension_vision python -m workers.classify_dimension_vision --limit 100
  # Only touches games still dimension=unknown after the free rule-based pass.
  dimension_vision:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL:-claude-opus-5}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.classify_dimension_vision"]

  # Opt-in, costs real API money. Flags need the full command form (compose
  # replaces `command:` with whatever follows the service name):
  #   docker compose run --rm dimension_similarity python -m workers.classify_dimension_similarity --limit 100
  # Last resort after the rule-based and vision passes: estimates 2D/3D from
  # metadata similarity for games no tag, rule or screenshot could settle.
  dimension_similarity:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL:-claude-opus-5}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.classify_dimension_similarity"]

  # Scheduled worker — run daily:  docker compose run --rm refresher
  refresher:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.refresh_stats"]

  # Fast-clone restore — full catalog from the committed snapshot in seconds:
  #   docker compose run --rm db_restore
  #   docker compose run --rm backend alembic upgrade head
  # Idempotent (--clean --if-exists drops and recreates dumped objects).
  # Refresh the snapshot manually with: bash scripts/export_db.sh
  db_restore:
    image: postgres:16-alpine
    profiles: ["scrape"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-steam}
    volumes:
      - ./database/seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      pg_restore --clean --if-exists --no-owner --no-privileges
      -h db -U ${POSTGRES_USER:-steam} -d ${POSTGRES_DB:-steam2026}
      /seed/full_export.dump

  # Quick-start seed — real data in ~10 minutes on a fresh clone:
  #   docker compose run --rm seed
  # Discovers ~100 games from Steam Search (2 pages), then collects full
  # store data for the first 50. Safe to re-run; safe to interrupt.
  seed:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command:
      - sh
      - -c
      - |
        python -m scraper.discovery.run --mode search --max-pages 2 &&
        python -m scraper.collectors.run --limit 50

  # Warm the video cache for approved games:  docker compose run --rm video_prefetch
  #   with flags: docker compose run --rm video_prefetch python -m workers.prefetch_videos --limit 200
  video_prefetch:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Worker containers don't read .env themselves — compose must inject these.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command: ["python", "-m", "workers.prefetch_videos"]

  # Full pipeline:  docker compose run --rm pipeline
  # discovery → store data for ALL queued games → market data for ALL queued games
  pipeline:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["scrape"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam2026}
      LOGS_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/data/logs
    command:
      - sh
      - -c
      - |
        python -m scraper.discovery.run --mode search &&
        python -m scraper.collectors.run &&
        python -m scraper.collectors.run_market

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time and read by the BROWSER, so it must be the
        # host-side backend port (9100), not the container-internal 8000.
        NEXT_PUBLIC_API_URL: http://localhost:9100
    restart: unless-stopped
    environment:
      # Community Clips server-side keys (empty = platform gracefully skipped)
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_USER_LOGIN: ${TWITCH_USER_LOGIN:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # host:container — Next's standalone server listens on 3000 inside.
      - "4000:3000"

volumes:
  pgdata:
