[project]
name = "steam2026-backend"
version = "0.1.0"
description = "Steam 2026 Indie Intelligence Platform — backend API and data layer"
# Docker runs Python 3.13; 3.12 allowed for local development convenience.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiohttp>=3.10",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "tenacity>=9.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"
